name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg2://portfolio_user:portfolio_password@localhost:5432/business_operations

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portfolio_user
          POSTGRES_PASSWORD: portfolio_password
          POSTGRES_DB: business_operations
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U portfolio_user -d business_operations"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q